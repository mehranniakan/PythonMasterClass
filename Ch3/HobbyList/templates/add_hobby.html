<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم اطلاعات شخصی</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box; /* مهم برای محاسبه عرض */
            font-size: 14px;
            font-family: 'Tahoma', sans-serif;
        }

        select {
            background-color: white; /* برای اطمینان از رنگ پس‌زمینه */
        }

        textarea {
            resize: vertical; /* اجازه تغییر اندازه عمودی */
            min-height: 100px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px 20px;
            background-color: #4CAF50; /* سبز */
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #45a049;
        }

        /* استایل برای گزینه های خاص در dropdown */
        option {
            font-family: 'Tahoma', sans-serif;
        }

        option[value=""] {
            color: #999; /* رنگ گزینه پیش‌فرض */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>فرم اطلاعات شخصی</h1>
    {% if message %}
        <p>
            {{ message }}
        </p>
    {% endif %}

    <form action="/add" method="POST">
        <div class="form-group">
            <label for="name">نام:</label>
            <input type="text" id="name" name="name" placeholder="نام خود را وارد کنید" required>
        </div>

        <div class="form-group">
            <label for="age">سن:</label>
            <input type="number" id="age" name="age" min="1" max="120" placeholder="سن شما" required>
        </div>

        <div class="form-group">
            <label for="interest">علاقه مندی :</label>
            <input type="text" id="interest" name="interest" placeholder="علاقه مندی خود را وارد کنید ..." required>
        </div>

        <div class="form-group">
            <label for="interest_level">میزان علاقه:</label>
            <select id="interest_level" name="interest_level" required>
                <option value="" disabled selected>-- میزان علاقه را مشخص کنید --</option>
                <option value="1">1 - خیلی کم</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5 - متوسط</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10 - خیلی زیاد</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">توضیحات اضافی:</label>
            <textarea id="description" name="description" rows="5"
                      placeholder="توضیحات خود را اینجا وارد کنید..."></textarea>
        </div>

        <button type="submit">ارسال اطلاعات</button>
    </form>
</div>

</body>
</html>
